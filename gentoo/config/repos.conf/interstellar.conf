# Drop this at /etc/portage/repos.conf/interstellar.conf on a Gentoo system to
# enable the Interstellar overlay. It layers on top of the ::gentoo repo.
#
# For local development, point `location` at this repo's gentoo/overlay dir:
#   location = /path/to/osaima/gentoo/overlay
# For a released distro, sync from git instead (sync-* lines below).

[interstellar]
location = /var/db/repos/interstellar
sync-type = git
sync-uri = https://github.com/akashmanjunath2505/osaima.git
auto-sync = yes
masters = gentoo
priority = 100
