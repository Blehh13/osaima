# Portage repository layout for the Interstellar OS (OSAIMA) overlay.
# This overlay is the distro's customization layer: it sits on top of the
# upstream ::gentoo repository and provides only the packages, profiles and
# branding that make Interstellar its own distribution.
repo-name = interstellar
masters = gentoo
thin-manifests = true
sign-manifests = false
profile-formats = profile-set
