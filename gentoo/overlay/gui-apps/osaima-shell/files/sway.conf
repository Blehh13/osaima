# Minimal sway configuration for the Interstellar OS session.
#
# The OSAIMA shell is the desktop: it draws its own windows, dock and launcher,
# so sway only provides the Wayland display, input and outputs.

set $mod Mod4

default_border none
default_floating_border none
output * bg #05080f solid_color
xwayland enable

# The shell. If it ever fails, the shortcuts below are the way out.
exec osaima-shell

bindsym $mod+Return exec foot
bindsym $mod+Shift+e exec swaymsg exit

# Site and user additions.
include /etc/osaima/sway.d/*
include ~/.config/osaima/sway.d/*
