[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "osaima-agent"
version = "0.1.0"
description = "OSAIMA AI agent: turns natural-language requests into safe actions through the AI Core"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0,<2",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
# Local speech: faster-whisper listens, Piper speaks. Not needed for text chat.
voice = [
    "faster-whisper>=1.1,<2",
    "piper-tts>=1.3,<2",
]
dev = [
    "mypy>=1.11",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.16,<0.17",
]

[project.scripts]
osaima-agent = "osaima_agent.__main__:main"

[project.urls]
Repository = "https://github.com/Blehh13/osaima"

[tool.hatch.build.targets.wheel]
packages = ["src/osaima_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["osaima_agent"]
mypy_path = "src"
