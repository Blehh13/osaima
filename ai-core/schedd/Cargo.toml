[package]
name = "osaima-schedd"
version = "0.1.0"
edition = "2021"
description = "OSAIMA scheduler daemon: learns what each process is doing and sets its CPU priority to match"
license = "GPL-3.0-or-later"
repository = "https://github.com/Blehh13/osaima"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[lib]
name = "osaima_schedd"
path = "src/lib.rs"

[[bin]]
name = "osaima-schedd"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
