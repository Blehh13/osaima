[package]
name = "mcp-daemon"
version = "0.1.0"
edition = "2021"
description = "OSAIMA Model Context Protocol Daemon"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.30"
futures = "0.3"
reqwest = { version = "0.11", features = ["json"] }
zbus = "4.0"
regex = "1.10"
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
landlock = "0.4"
seccompiler = "0.4"
libc = "0.2"
