name: ISO feasibility spike

# Experiments that answer one question: can a bootable Interstellar OS image be
# built on a free GitHub runner? Run by hand; each experiment writes a report to
# the job summary. See build-tools/spike/README.md.

on:
  push:
    branches: ["spike/**"]
    paths:
      - "build-tools/spike/**"
      - "gentoo/**"
      - ".github/workflows/iso-spike.yml"
  workflow_dispatch:
    inputs:
      stage3:
        description: "Gentoo stage3 container tag"
        default: "latest"

permissions:
  contents: read

jobs:
  binhost-check:
    name: "1. Binary packages available?"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: The runner
        run: |
          {
            echo "## Runner"
            echo
            echo '```'
            echo "CPUs: $(nproc)"
            free -g | head -2
            df -h / /mnt 2>/dev/null
            ls -l /dev/kvm 2>&1
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Dry run in a Gentoo container
        run: |
          docker run --rm --privileged -v "$PWD:/work" "gentoo/stage3:${{ inputs.stage3 || 'latest' }}" \
            bash /work/build-tools/spike/binhost-check.sh
      - name: Show the report
        if: always()
        run: |
          if [ -f spike-out/summary.md ]; then cat spike-out/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: binhost-check
          path: spike-out
