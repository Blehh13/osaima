name: Build the OS image

# Builds Interstellar OS into a bootable live ISO on a free runner, boots it in QEMU
# and runs the VM smoke tests. Everything the image script needs from the outside is
# built or downloaded here: the daemon, the sandbox helper, the shell, llama.cpp, a
# language model and the exported intent router. It takes a long time, so it runs by
# hand, or when the image scripts change on the feat/m5-iso branch.
#
# stop_after lets you stop at an earlier stage when something needs fixing:
#   inputs (the daemon, shell, llama.cpp, model, router), image (the root filesystem),
#   iso (the ISO), boot (it boots), test (the VM smoke tests, the default).

on:
  workflow_dispatch:
    inputs:
      stop_after:
        description: "Stage to stop after: inputs, image, iso, boot or test"
        default: "test"
      release_tag:
        description: "Publish both ISOs as a GitHub release with this tag (e.g. v0.1.0); empty = do not publish. Only after every test passed."
        default: ""
  push:
    branches: ["feat/m5-iso"]
    paths:
      - ".github/workflows/image.yml"
      - "build-tools/scripts/**"

permissions:
  contents: write  # only the publish step uses it, and only when release_tag is given

env:
  STOP: ${{ inputs.stop_after || 'test' }}
  OUT_VM: ${{ github.workspace }}/out/vm

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    defaults:
      run:
        # bash -eo pipefail: a failing script piped into tee must fail its step
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Host packages
        # normally under a minute; a stalled mirror must not eat the whole run
        timeout-minutes: 25
        run: |
          sudo bash build-tools/ci/apt-fast-mirror.sh
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            squashfs-tools xorriso mtools grub-pc-bin grub-efi-amd64-bin dosfstools \
            qemu-system-x86 openssh-client openssl rsync curl xz-utils zstd python3-venv python3-pip \
            clang llvm libbpf-dev libelf-dev zlib1g-dev linux-tools-generic
          df -h / | tail -1

      # ── 1. What the image script expects to find ───────────────────────────
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ai-core/mcp-daemon
            ui/osaima-shell/src-tauri
            ai-core/schedd

      - name: Build the daemon and the sandbox helper
        working-directory: ai-core/mcp-daemon
        run: cargo build --locked --release

      - name: Build the shell
        working-directory: ui/osaima-shell/src-tauri
        run: cargo build --locked --release

      - name: Build the scheduler and its eBPF telemetry
        working-directory: ai-core/schedd
        run: |
          cargo build --locked --release
          bpftool=$(find /usr/lib -maxdepth 3 -name bpftool -type f -print -quit)
          make -C bpf BPFTOOL="$bpftool"
          ls -l target/release/osaima-schedd bpf/telemetry.bpf.o model/model.json

      - name: Download llama.cpp (the on-device model server)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dest="$HOME/.local/share/osaima/llama"
          mkdir -p "$dest"
          # the newest releases; the plain CPU build for Ubuntu (not the CUDA, Vulkan or ROCm ones)
          url=$(gh api repos/ggml-org/llama.cpp/releases --jq '[.[0:5][].assets[].browser_download_url | select(test("llama-b[0-9]+-bin-ubuntu-x64[.](zip|tar[.]gz)$"))][0]')
          echo "llama.cpp: $url"
          if [ -z "$url" ] || [ "$url" = null ]; then echo "no llama.cpp CPU build found"; exit 1; fi
          curl -fL --retry 3 -o "$RUNNER_TEMP/llama.pkg" "$url"
          case "$url" in
            *.zip) unzip -q "$RUNNER_TEMP/llama.pkg" -d "$dest" ;;
            *) tar -xzf "$RUNNER_TEMP/llama.pkg" -C "$dest" ;;
          esac
          server=$(find "$dest" -name llama-server -type f -print -quit)
          chmod +x "$server"
          echo "found $server"
          "$server" --version 2>&1 | head -3 || true

      - name: Voice engines (whisper.cpp and Piper, on the device)
        run: |
          # where ai-core/mcp-daemon/src/voice.rs looks for them, and build_vm_image.sh copies them from
          base="$HOME/.local/share/osaima"
          mkdir -p "$base/whisper/models" "$base/piper"
          # whisper.cpp, static and for any x86-64 CPU (not tuned to this runner's)
          git clone -q --depth 1 --branch v1.7.6 https://github.com/ggml-org/whisper.cpp "$RUNNER_TEMP/whisper.cpp"
          cmake -S "$RUNNER_TEMP/whisper.cpp" -B "$RUNNER_TEMP/whisper-build" -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF -DWHISPER_BUILD_TESTS=OFF > /dev/null
          cmake --build "$RUNNER_TEMP/whisper-build" --target whisper-cli -j "$(nproc)" > /dev/null
          install -m755 "$RUNNER_TEMP/whisper-build/bin/whisper-cli" "$base/whisper/whisper-cli"
          curl -fL --retry 3 -o "$base/whisper/models/ggml-base.en.bin" \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en.bin
          # Piper: its Linux release (binary, libraries, espeak-ng data) and one English voice
          curl -fL --retry 3 https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_linux_x86_64.tar.gz \
            | tar -xz -C "$base/piper"
          for f in en_US-lessac-medium.onnx en_US-lessac-medium.onnx.json; do
            curl -fL --retry 3 -o "$base/piper/$f" \
              "https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/$f"
          done
          # they must actually run here: a transcript of the sample, and a spoken sentence
          "$base/whisper/whisper-cli" -m "$base/whisper/models/ggml-base.en.bin" -f "$RUNNER_TEMP/whisper.cpp/samples/jfk.wav" -nt 2> /dev/null | tee /dev/stderr | grep -qi "country"
          echo "Your computer is ready." | "$base/piper/piper/piper" --model "$base/piper/en_US-lessac-medium.onnx" --output_file "$RUNNER_TEMP/hello.wav"
          test "$(stat -c %s "$RUNNER_TEMP/hello.wav")" -gt 10000
          du -sh "$base/whisper" "$base/piper"

      - name: Download the language model (Phi-4 mini, free)
        run: |
          dest="$HOME/.local/share/osaima/models"
          mkdir -p "$dest"
          curl -fL --retry 3 -o "$dest/phi-4-mini-Q4_K_M.gguf" \
            "https://huggingface.co/bartowski/microsoft_Phi-4-mini-instruct-GGUF/resolve/main/microsoft_Phi-4-mini-instruct-Q4_K_M.gguf"
          ls -lh "$dest"
          head -c 4 "$dest/phi-4-mini-Q4_K_M.gguf" | grep -q GGUF

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Train and export the intent router
        working-directory: ai-core/intent-router
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet transformers sentence-transformers scikit-learn joblib numpy onnx onnxruntime tokenizers
          python train_embed_classifier.py
          python export_onnx.py
          ls -lh intent_embed

      - name: Python packages the image script runs on the host
        run: sudo /usr/bin/python3 -m pip install --quiet --break-system-packages --ignore-installed onnxruntime tokenizers numpy

      # ── 2. The image ───────────────────────────────────────────────────────
      - name: Build the root filesystem
        if: env.STOP != 'inputs'
        run: |
          mkdir -p out
          sudo env SKIP_DISK=1 REQUIRE_VOICE=1 OUT="$OUT_VM" bash build-tools/scripts/build_vm_image.sh 2>&1 | tee out/build_vm_image.log

      - name: Build the live ISO
        if: env.STOP != 'inputs' && env.STOP != 'image'
        run: sudo env LITE=1 OUT="${{ github.workspace }}/out" bash build-tools/scripts/build_iso.sh 2>&1 | tee out/build_iso.log

      # Keep the ISOs whatever happens next: a later test or the publish step may fail,
      # and the runner's disk is gone when the job ends.
      - name: Keep the lite ISO (7 days)
        if: env.STOP != 'inputs' && env.STOP != 'image'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: interstellar-os-lite-iso
          path: out/interstellar-os-lite.iso
          compression-level: 0
          retention-days: 7
      - name: Keep the full ISO (7 days)
        if: env.STOP != 'inputs' && env.STOP != 'image'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: interstellar-os-iso
          path: out/interstellar-os.iso
          compression-level: 0
          retention-days: 7

      # ── 3. Does it boot? ───────────────────────────────────────────────────
      - name: Boot the ISO
        if: env.STOP != 'inputs' && env.STOP != 'image' && env.STOP != 'iso'
        run: |
          sudo chmod a+rw /dev/kvm
          sudo chown -R "$USER" out
          ISO=1 HEADLESS=1 ISO_PATH="$PWD/out/interstellar-os.iso" OUT="$OUT_VM" MEM=8G \
            nohup bash build-tools/scripts/run_vm.sh > out/run_vm.log 2>&1 &
          # wait for the login prompt on the serial console
          for i in $(seq 1 120); do
            grep -q "login:" "$OUT_VM/serial.log" 2>/dev/null && { echo "booted after about $((i * 5)) s"; exit 0; }
            sleep 5
          done
          echo "no login prompt within 10 minutes"
          tail -40 "$OUT_VM/serial.log" || true
          exit 1

      - name: VM smoke tests
        if: env.STOP == 'test'
        run: OUT="$OUT_VM" bash build-tools/scripts/test_vm.sh 2>&1 | tee out/test_vm.log

      - name: Boot the lite ISO and let it download its model
        if: env.STOP == 'test'
        run: |
          pkill -f qemu-system-x86_64 || true
          while pgrep -f qemu-system-x86_64 > /dev/null; do sleep 1; done
          : > "$OUT_VM/serial.log"
          ISO=1 HEADLESS=1 ISO_PATH="$PWD/out/interstellar-os-lite.iso" OUT="$OUT_VM" MEM=8G \
            nohup bash build-tools/scripts/run_vm.sh > out/run_vm_lite.log 2>&1 &
          ssh_vm() { ssh -q -p 2222 -i "$OUT_VM/id_osaima" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@127.0.0.1 "$@"; }
          for _ in $(seq 1 120); do ssh_vm true 2> /dev/null && break; sleep 5; done
          echo "booted; waiting for the model download and llama-server (up to 25 minutes)"
          start=$(date +%s)
          for _ in $(seq 1 300); do
            if ssh_vm 'curl -sf http://127.0.0.1:8080/v1/models' > /dev/null 2>&1; then
              echo "  PASS  lite ISO: model downloaded and llama-server answering after $(( $(date +%s) - start )) s" | tee out/test_lite.log
              ssh_vm 'ls -l /home/osaima/.local/share/osaima/models/' | tee -a out/test_lite.log
              exit 0
            fi
            sleep 5
          done
          echo "  FAIL  lite ISO: no model server within 25 minutes" | tee out/test_lite.log
          ssh_vm 'journalctl _SYSTEMD_USER_UNIT=osaima-llm.service --no-pager | tail -20; df -h /run' || true
          exit 1

      - name: Publish the ISOs as a release
        if: success() && env.STOP == 'test' && inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          cd out
          rm -rf release && mkdir release
          sha256sum interstellar-os.iso interstellar-os-lite.iso > release/SHA256SUMS
          full_size=$(numfmt --to=si --suffix=B "$(stat -c %s interstellar-os.iso)")
          lite_size=$(numfmt --to=si --suffix=B "$(stat -c %s interstellar-os-lite.iso)")
          # a release file may be at most 2 GiB: split what is bigger, into parts to join
          for iso in interstellar-os.iso interstellar-os-lite.iso; do
            if [ "$(stat -c %s "$iso")" -gt 2000000000 ]; then
              split -b 1900M -d -a 2 "$iso" "release/$iso.part-"
            else
              mv "$iso" release/
            fi
          done
          (cd release && sha256sum *.part-* >> SHA256SUMS 2> /dev/null || true)
          ls -lh release
          {
            echo "Interstellar OS (OSAIMA), built and tested by the \`Build the OS image\` workflow (run ${{ github.run_id }}, commit ${GITHUB_SHA::7})."
            echo
            echo "Every VM smoke test passed on this build: the desktop, the local LLM, voice, the eBPF scheduler, the kernel sandbox and the audit log."
            echo
            echo "### Which one"
            echo
            echo "- **interstellar-os.iso** (full, $full_size): works with no internet."
            echo "- **interstellar-os-lite.iso** ($lite_size): the same system without the language model; it downloads the model (about 2.4 GB, free, no account) when it first starts, so it needs the internet. On the live system the download is kept in memory, so it is fetched again after each reboot."
            echo
            echo "8 GB of RAM is recommended. Boots on BIOS and UEFI; write it to a USB stick or boot it in a VM. Nothing is installed: the live system changes nothing on the computer's disk."
            for iso in interstellar-os.iso interstellar-os-lite.iso; do
              ls "release/$iso.part-"* > /dev/null 2>&1 || continue
              win=$(cd release && echo "$iso".part-* | sed 's/ / + /g')
              echo
              echo "### Joining $iso"
              echo
              echo "A release file may be at most 2 GB, so this ISO is in parts. Download all of them into one folder, then join them."
              echo
              echo "Linux or macOS:"
              echo '```'
              echo "cat $iso.part-* > $iso"
              echo "sha256sum -c --ignore-missing SHA256SUMS"
              echo '```'
              echo "Windows (Command Prompt, in that folder):"
              echo '```'
              echo "copy /b $win $iso"
              echo "certutil -hashfile $iso SHA256"
              echo '```'
              echo "and compare the result with the line for $iso in SHA256SUMS."
            done
          } > release-notes.md
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Interstellar OS $TAG" --notes-file release-notes.md

      - name: Summary
        if: always()
        run: |
          {
            echo "## Image build (stopped after: $STOP)"
            echo '```'
            ls -lh out/*.iso 2>&1 | head -3 || true
            df -h / | tail -1 || true
            grep -E "^==> " out/build_vm_image.log out/build_iso.log 2>/dev/null | sed 's#out/##' || true
            echo '```'
            echo "### VM smoke tests"
            echo '```'
            grep -E "PASS|FAIL|WARN|INFO|^==" out/test_vm.log out/test_lite.log 2>/dev/null | head -60 || true
            echo '```'
            echo "### Last of the console"
            echo '```'
            tail -25 "$OUT_VM/serial.log" 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-logs
          path: |
            out/*.log
            out/vm/serial.log
          retention-days: 7
          if-no-files-found: ignore
