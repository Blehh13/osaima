name: CI

on:
  push:
    branches: [master, "feat/**", "fix/**", "feature/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Every check step runs even when an earlier one fails, so one push reports
# everything. When formatting fails, a `rustfmt-patch-*` artifact holds the
# fix: download it and run `git apply rustfmt.patch` (no local Rust needed).

jobs:
  daemon:
    name: AI Core daemon
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ai-core/mcp-daemon
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ai-core/mcp-daemon
      - name: Test
        run: cargo test --locked
      - name: Clippy
        if: success() || failure()
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Format
        if: success() || failure()
        run: cargo fmt --check || { cargo fmt && git diff > "$RUNNER_TEMP/rustfmt.patch"; exit 1; }
      - name: Upload rustfmt fix
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-patch-daemon
          path: ${{ runner.temp }}/rustfmt.patch
          if-no-files-found: ignore
      - name: Release build
        if: success() || failure()
        run: cargo build --locked --release
      - uses: actions/setup-python@v5
        if: success() || failure()
        with:
          python-version: "3.12"
      - name: Interoperability with the official MCP SDK
        if: success() || failure()
        run: |
          pip install --quiet "mcp>=1.10,<2"
          python tests/interop/mcp_sdk_client.py target/release/mcp-daemon
      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: mcp-daemon
          path: ai-core/mcp-daemon/target/release/mcp-daemon
          if-no-files-found: ignore

  shell-backend:
    name: Shell backend (Tauri)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui/osaima-shell/src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Install WebKitGTK and build dependencies
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ui/osaima-shell/src-tauri
      - name: Test
        run: cargo test --locked
      - name: Clippy
        if: success() || failure()
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Format
        if: success() || failure()
        run: cargo fmt --check || { cargo fmt && git diff > "$RUNNER_TEMP/rustfmt.patch"; exit 1; }
      - name: Upload rustfmt fix
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-patch-shell
          path: ${{ runner.temp }}/rustfmt.patch
          if-no-files-found: ignore

  frontend:
    name: Shell frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui/osaima-shell/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          for f in $(find src -name '*.js'); do
            node --input-type=module --check < "$f" || { echo "::error file=$f::syntax error"; exit 1; }
          done
      - name: Unit tests
        if: success() || failure()
        run: npm test

  agent:
    name: AI agent (Python)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ai-core/agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-core/agent/pyproject.toml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ai-core/mcp-daemon
      - name: Build the AI Core for integration tests
        working-directory: ai-core/mcp-daemon
        run: cargo build --locked
      - name: Install
        run: pip install -e ".[dev]"
      - name: Check that the voice extras can be installed
        run: pip install --dry-run ".[voice]"
      - name: Test
        env:
          OSAIMA_DAEMON_BIN: ${{ github.workspace }}/ai-core/mcp-daemon/target/debug/mcp-daemon
          # The tool-snapshot test writes the daemon's current tool list here.
          OSAIMA_SNAPSHOT_OUT: ${{ runner.temp }}/tools.snapshot.json
        run: pytest -q
      - name: Upload the current tool snapshot
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: tools-snapshot
          path: ${{ runner.temp }}/tools.snapshot.json
          if-no-files-found: ignore
      - name: Type check
        if: success() || failure()
        run: mypy
      - name: Lint and format
        if: success() || failure()
        run: |
          ruff check . && ruff format --check . || {
            ruff check --fix . ; ruff format . ; git diff > "$RUNNER_TEMP/ruff.patch"; exit 1;
          }
      - name: Upload ruff fix
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-patch-agent
          path: ${{ runner.temp }}/ruff.patch
          if-no-files-found: ignore

  scripts:
    name: Session and packaging scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: |
          shellcheck --severity=warning \
            gentoo/overlay/gui-apps/osaima-shell/files/osaima-session \
            build-tools/tests/test-session.sh
      - name: Session script test
        if: success() || failure()
        run: sh build-tools/tests/test-session.sh
      - name: Install udev rule syntax check
        if: success() || failure()
        run: |
          sudo apt-get install -y --no-install-recommends udev
          sudo cp gentoo/overlay/sys-apps/osaima-ai-core/files/90-osaima-backlight.rules /etc/udev/rules.d/
          sudo udevadm verify /etc/udev/rules.d/90-osaima-backlight.rules
