name: Model evaluation

# Measures how well a local model chooses tools, using Ollama on a free GitHub
# runner (CPU only, so it is slow but costs nothing). Run it by hand from the
# Actions tab; the report is in the job summary and the results are an artifact.

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Ollama model to test (must support tool calling)"
        default: "qwen2.5:7b"
      limit:
        description: "Only the first N cases (empty for all 157)"
        default: ""

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    defaults:
      run:
        working-directory: ai-core/agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the agent
        run: pip install -e .
      - name: Check the evaluation data
        run: python -m osaima_agent eval --validate-only
      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh
      - name: Wait for Ollama and download the model
        env:
          MODEL: ${{ inputs.model }}
        run: |
          # The installer only starts a service when systemd is running, which a
          # runner may not have, so start the server ourselves if it isn't up.
          up() { curl -fs http://127.0.0.1:11434/api/version > /dev/null; }
          sleep 3
          if ! up; then
            nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          fi
          for _ in $(seq 1 30); do
            up && break
            sleep 2
          done
          if ! up; then
            echo "Ollama did not start:"
            cat "$RUNNER_TEMP/ollama.log" 2>/dev/null
            exit 1
          fi
          ollama pull "$MODEL"
      - name: Run the evaluation
        env:
          MODEL: ${{ inputs.model }}
          LIMIT: ${{ inputs.limit }}
        run: |
          # A CPU-only runner can take a while on the first request.
          printf '[local]\ntimeout_s = 300\n' > "$RUNNER_TEMP/agent.toml"
          export OSAIMA_AGENT_CONFIG="$RUNNER_TEMP/agent.toml"
          args=(--provider local --model "$MODEL" --out results)
          if [ -n "$LIMIT" ]; then args+=(--limit "$LIMIT"); fi
          python -m osaima_agent eval "${args[@]}"
      - name: Show the report
        if: always()
        run: |
          if [ -f results/summary.md ]; then cat results/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: ai-core/agent/results
